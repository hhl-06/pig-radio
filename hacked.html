<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>TERMINAL // SECURE CONNECTION</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#0a0a0a;
  font-family: "Courier New", "SF Mono", "Fira Code", monospace;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  user-select:none; -webkit-user-select:none;
  overflow-x:hidden; cursor:crosshair;
}

/* Scan lines */
body::after {
  content:''; position:fixed; top:0;left:0;right:0;bottom:0;
  background: repeating-linear-gradient(0deg, rgba(0,255,0,0.02) 0px, rgba(0,255,0,0.02) 2px, transparent 2px, transparent 4px);
  pointer-events:none; z-index:9999;
}

.terminal {
  width:100%; max-width:700px; min-height:90vh;
  background:rgba(0,10,0,0.95);
  border:1px solid rgba(0,255,0,0.15);
  border-radius:4px;
  padding:24px;
  position:relative;
  box-shadow: 0 0 60px rgba(0,255,0,0.05), inset 0 0 60px rgba(0,0,0,0.5);
  overflow:hidden;
}

/* Title bar */
.term-titlebar {
  position:absolute; top:0; left:0; right:0;
  background:rgba(0,255,0,0.05); border-bottom:1px solid rgba(0,255,0,0.1);
  padding:6px 14px; font-size:11px; color:rgba(0,255,0,0.4);
  display:flex; align-items:center; gap:8px;
}
.term-dot { width:8px; height:8px; border-radius:50%; }
.term-dot.r { background:#ff5f57; }
.term-dot.y { background:#febc2e; }
.term-dot.g { background:#28c840; }

.term-body { margin-top:28px; font-size:13px; line-height:1.7; color:rgba(0,255,0,0.85); min-height:70vh; }

.term-body .line { margin-bottom:2px; white-space:pre-wrap; word-break:break-all; }
.term-body .line .prompt { color:rgba(0,255,0,0.5); }
.term-body .line .cmd { color:rgba(0,255,0,0.9); }
.term-body .line .output { color:rgba(0,255,0,0.6); }
.term-body .line .highlight { color:#0f0; font-weight:700; }
.term-body .line .warn { color:#ff0; }
.term-body .line .danger { color:#f44; }
.term-body .line .info { color:#0af; }
.term-body .line .dim { color:rgba(0,255,0,0.35); }

/* Blinking cursor */
.cursor {
  display:inline-block; width:8px; height:15px; background:rgba(0,255,0,0.9);
  animation: blink 0.8s step-end infinite; vertical-align:middle; margin-left:2px;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

/* Progress bar */
.prog-wrap {
  width:100%; height:4px; background:rgba(0,255,0,0.08);
  border-radius:2px; margin:4px 0; overflow:hidden;
}
.prog-bar {
  height:100%; background:linear-gradient(90deg, rgba(0,255,0,0.4), rgba(0,255,0,0.9));
  border-radius:2px; transition:width 0.3s ease; width:0%;
}

/* Reveal panel - shows after hack */
.reveal-panel {
  margin-top:20px; border:1px solid rgba(0,255,0,0.2); border-radius:4px;
  padding:16px; background:rgba(0,255,0,0.02);
  animation: revealIn 0.6s ease;
}
@keyframes revealIn {
  from { opacity:0; transform:translateY(10px); border-color:rgba(0,255,0,0.5); }
  to { opacity:1; transform:translateY(0); }
}
.reveal-panel .rev-title {
  font-size:15px; font-weight:700; color:#0f0; margin-bottom:12px;
  text-align:center; letter-spacing:3px;
}
.reveal-panel .rev-row {
  display:flex; justify-content:space-between; padding:4px 0;
  border-bottom:1px solid rgba(0,255,0,0.05); font-size:12px;
}
.reveal-panel .rev-row .rev-label { color:rgba(0,255,0,0.5); }
.reveal-panel .rev-row .rev-val { color:rgba(0,255,0,0.9); text-align:right; }

/* Glitch effect */
.glitch-overlay {
  position:fixed; top:0;left:0;right:0;bottom:0;
  pointer-events:none; z-index:9998;
  animation: glitchFlash 0.3s ease-out forwards;
}
@keyframes glitchFlash {
  0%{ background:rgba(0,255,0,0.1); }
  100%{ background:transparent; }
}

/* Final button */
.escape-btn {
  display:block; margin:16px auto 0; padding:8px 28px;
  background:rgba(0,255,0,0.08); border:1px solid rgba(0,255,0,0.3);
  color:rgba(0,255,0,0.8); border-radius:4px; font-size:12px;
  font-family:inherit; cursor:pointer; transition:all 0.2s;
}
.escape-btn:hover { background:rgba(0,255,0,0.15); border-color:rgba(0,255,0,0.5); color:#0f0; }

/* Toast */
.toast {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  z-index:10000; background:rgba(0,0,0,0.9); border:1px solid rgba(0,255,0,0.3);
  color:#0f0; padding:8px 20px; border-radius:20px; font-size:12px; font-weight:600;
  font-family:inherit; animation: toastIn 0.3s ease-out; pointer-events:none;
}
@keyframes toastIn { from{transform:translateX(-50%) translateY(-30px);opacity:0;} to{transform:translateX(-50%) translateY(0);opacity:1;} }

/* Mobile */
@media (max-width:480px) {
  .terminal { max-width:100%; min-height:100vh; border-radius:0; padding:16px; }
  .term-body { font-size:11px; }
  .reveal-panel .rev-row { font-size:10px; }
}
</style>
</head>
<body>

<div class="terminal">
  <div class="term-titlebar">
    <span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
    root@anonymous:~# terminal — secure connection
  </div>
  <div class="term-body" id="termBody"></div>
</div>

<script>
// ============================================================
// TERMINAL CONTROLLER
// ============================================================
var body = document.getElementById('termBody');
var lines = [];

function appendLine(html) {
  var div = document.createElement('div'); div.className = 'line'; div.innerHTML = html;
  body.appendChild(div); lines.push(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

// Type text character by character
function typeLine(prefixHtml, text, speed, cls) {
  return new Promise(function(resolve){
    var div = document.createElement('div'); div.className = 'line';
    if (prefixHtml) div.innerHTML = prefixHtml;
    body.appendChild(div); lines.push(div);
    body.scrollTop = body.scrollHeight;
    var i = 0;
    function type(){
      if (i < text.length) {
        div.innerHTML = (prefixHtml||'') + text.substring(0, i+1) + '<span class="cursor"></span>';
        i++;
        setTimeout(type, speed || 30);
      } else {
        div.innerHTML = (prefixHtml||'') + '<span class="'+(cls||'output')+'">' + text + '</span>';
        resolve();
      }
    }
    type();
  });
}

function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }

function appendProgress(label, duration) {
  return new Promise(function(resolve){
    var div = document.createElement('div'); div.className = 'line';
    div.innerHTML = '<span class="dim">'+label+'</span>';
    body.appendChild(div);
    var progWrap = document.createElement('div'); progWrap.className = 'prog-wrap';
    var progBar = document.createElement('div'); progBar.className = 'prog-bar';
    progWrap.appendChild(progBar);
    body.appendChild(progWrap);
    body.scrollTop = body.scrollHeight;

    var pct = 0, interval = setInterval(function(){
      pct += Math.random() * 18;
      if (pct > 100) { pct = 100; clearInterval(interval);
        progBar.style.width = '100%';
        div.innerHTML = '<span class="highlight">'+label+' [OK]</span>';
        setTimeout(resolve, 300);
        return;
      }
      progBar.style.width = pct + '%';
    }, duration / 15 || 80);
  });
}

function appendRevealPanel(title, rows) {
  var div = document.createElement('div'); div.className = 'reveal-panel';
  var html = '<div class="rev-title">'+title+'</div>';
  rows.forEach(function(r){
    html += '<div class="rev-row"><span class="rev-label">'+r[0]+'</span><span class="rev-val">'+r[1]+'</span></div>';
  });
  div.innerHTML = html;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

function glitchFlash() {
  var g = document.createElement('div'); g.className = 'glitch-overlay';
  document.body.appendChild(g); setTimeout(function(){ g.remove(); }, 400);
}

function toast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(function(){t.remove();},300); }, 2000);
}

// ============================================================
// FAKE PERSONAL DATA POOLS
// ============================================================
var SECRETS = [
  '浏览器历史记录中87%是"怎么治疗拖延症"相关搜索',
  '过去一年共撤回微信消息341条，其中340条是打错字',
  '相册检测到自拍2,847张，其中94%角度完全一致',
  '曾连续32天点同一家外卖，被评为"年度最专一干饭人"',
  '抖音上真正看完的视频占比：3%，其他都是3秒划走',
  '手机屏幕使用时间超越全国98%的人（主要是躺着刷）',
  '闹钟平均响铃次数：4.7次/天。实际起床时间比预设晚48分钟',
  '这一年说过最多的话："好的"（其实并不好）',
  '购物App上"待付款"订单数：47单。其中36单超过半年未支付',
  '周末平均起床时间：11:47。早餐？不存在的',
  '语音消息最长记录：3分24秒，对方只回了"嗯"',
  '曾打开计算器App假装在算东西，其实只是在发呆',
  '运动App数据显示：今年共走了7步（不含上厕所）',
  '密码中包含"123"的概率：极高。安全意识评级：F',
  '手机内存使用占比：微信58%，照片25%，系统10%，其他App 7%',
  '深夜（凌晨0-3点）活跃度：极高。第二天精神状态：极差'
];

var LIES = [
  'DNA检测结果显示：你的基因中有0.003%来自远古土豆',
  '通过量子计算推算，你前世是一只在唐朝御膳房偷吃的猫',
  '大数据显示你的朋友圈封面换了23次，越换越抽象',
  '你的WiFi历史连接记录表明你蹭过17个陌生人的网络',
  '你在B站发的弹幕中，"哈哈哈哈"占比67%，但其实并不好笑',
  '根据你的外卖记录推断：你有12%的概率其实是仓鼠转世',
  '你的淘宝浏览记录里有太多"只看看不买"的痕迹，被系统标记为"高危"',
  '据分析，你的英语水平停留在"Hello, how are you? I am fine, thank you"（其实最后一句忘了）',
  '你的网易云年度听歌报告中，深夜听的最多的歌是《大悲咒》（只是为了助眠）',
  '你的输入法预测功能已经掌握了你的全部说话套路，甚至可以替你聊天'
];

// ============================================================
// RUN THE HACK SEQUENCE
// ============================================================
async function run() {
  await sleep(800);

  // Phase 1: Connection
  await typeLine('<span class="dim">[</span><span class="info">*</span><span class="dim">]</span> ', '正在建立安全连接...', 25, 'dim');
  await sleep(300);
  await typeLine('<span class="dim">[</span><span class="highlight">+</span><span class="dim">]</span> ', '连接成功。远程节点：node-' + Math.random().toString(36).substring(2,10), 18, 'output');
  await sleep(200);

  // Phase 2: IP & device info
  await typeLine('<span class="dim">[</span><span class="info">i</span><span class="dim">]</span> ', '正在获取目标设备信息...', 20, 'dim');
  await sleep(400);
  appendLine('<span class="output">  IP Address: 192.168.'+Math.floor(Math.random()*255)+'.'+Math.floor(Math.random()*255)+'</span>');
  await sleep(150);
  appendLine('<span class="output">  User Agent: Mozilla/5.0 (Human; Susceptible to Clickbait)</span>');
  await sleep(150);
  appendLine('<span class="output">  Screen: '+window.screen.width+'x'+window.screen.height+' ('+(window.devicePixelRatio>1?'Retina':'Potato')+' Display)</span>');
  await sleep(150);
  appendLine('<span class="output">  Battery: '+(Math.random()*100).toFixed(0)+'% (probably dying)</span>');
  await sleep(300);

  // Phase 3: Directory enumeration
  await typeLine('<span class="dim">[</span><span class="warn">!</span><span class="dim">]</span> ', '扫描文件系统...', 30, 'warn');
  await sleep(200);
  appendLine('<span class="dim">  C:\\Users\\you\\Desktop\\待处理\\（未完成的任务堆成山）</span>');
  await sleep(100);
  appendLine('<span class="dim">  C:\\Users\\you\\Documents\\简历\\最终版_真的最终版_v3_final_真的不改了.doc</span>');
  await sleep(100);
  appendLine('<span class="dim">  C:\\Users\\you\\Downloads\\（全是没打开过的文件）</span>');
  await sleep(100);
  appendLine('<span class="dim">  C:\\Users\\you\\Photos\\表情包\\（重要文件，占内存最多）</span>');
  await sleep(300);

  // Phase 4: Data extraction
  await typeLine('<span class="dim">[</span><span class="danger">!!</span><span class="dim">]</span> ', '检测到可提取的个人数据包！开始解密...', 25, 'danger');
  glitchFlash();
  await sleep(400);

  await appendProgress('解密相册元数据...', 1200);
  await sleep(200);
  await appendProgress('提取浏览器历史...', 900);
  await sleep(200);
  await appendProgress('分析社交行为模式...', 1500);
  await sleep(200);
  await appendProgress('破解加密聊天记录...', 1100);
  await sleep(200);
  await appendProgress('生成个人档案...', 800);
  await sleep(500);

  // Phase 5: The reveal
  glitchFlash();
  await typeLine('', '', 0);
  appendLine('<span class="danger">══════════════════════════════════════</span>');
  appendLine('<span class="danger">  ⚠ 机密档案解密成功 ⚠</span>');
  appendLine('<span class="danger">══════════════════════════════════════</span>');
  await sleep(400);

  // Personal info reveal
  var usedSecrets = [];
  var pool = SECRETS.slice();
  for (var i = 0; i < 5; i++) {
    var idx = Math.floor(Math.random() * pool.length);
    usedSecrets.push(pool.splice(idx, 1)[0]);
  }

  appendRevealPanel('📁 CLASSIFIED DOSSIER', [
    ['文件编号', 'TOP-SECRET-' + Date.now().toString(36).toUpperCase()],
    ['目标代号', 'SLEEPER-' + Math.floor(Math.random()*9000+1000)],
    ['威胁等级', ['🟢 低（太懒了构不成威胁）','🟡 中（有摸鱼嫌疑）','🟠 较高（太能吃了）'][Math.floor(Math.random()*3)]],
    ['', ''],
    ['🔍 发现1', usedSecrets[0]],
    ['🔍 发现2', usedSecrets[1]],
    ['🔍 发现3', usedSecrets[2]],
    ['🔍 发现4', usedSecrets[3]],
    ['🔍 发现5', usedSecrets[4]],
    ['', ''],
    ['🤖 AI综合评估', pick(LIES)]
  ]);

  await sleep(800);

  // Phase 6: The twist
  appendLine('');
  await typeLine('<span class="dim">$</span> ', 'upload_to_server --target=you --status=owned', 20, 'output');
  await sleep(300);
  appendLine('<span class="warn">Warning: 以上数据即将上传至公共服务器</span>');
  await sleep(200);
  appendLine('<span class="warn">Warning: 你的"年度最蠢操作"合集正在打包中...</span>');
  await sleep(400);

  // The final line
  appendLine('');
  appendLine('<span class="dim">────────────────────────────────────────</span>');
  appendLine('<span class="output">  P.S. 以上内容均为随机生成，仅供娱乐 😏</span>');
  appendLine('<span class="output">  你的真实数据比这个还离谱，但我们就不曝光了</span>');
  appendLine('<span class="dim">────────────────────────────────────────</span>');

  // Escape button
  var btnDiv = document.createElement('div'); btnDiv.style.textAlign='center';
  var btn = document.createElement('button'); btn.className = 'escape-btn';
  btn.textContent = '🏃 赶紧逃跑（清除浏览痕迹）';
  btn.onclick = function(){
    document.body.style.transition = 'opacity 0.5s';
    document.body.style.opacity = '0';
    setTimeout(function(){
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:rgba(0,255,0,0.6);font-family:monospace;text-align:center;"><div><div style="font-size:48px;">🐷</div><div style="margin-top:16px;">来不及了。<br>你的数据已经在云端了。<br>（开玩笑的，什么都没存 ✌️）</div></div></div>';
      document.body.style.opacity = '1';
    }, 500);
  };
  btnDiv.appendChild(btn);
  body.appendChild(btnDiv);

  // Click anywhere for glitch effect
  document.addEventListener('click', function(){
    if (Math.random() > 0.5) glitchFlash();
  });

  // Escape key
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { toast('按ESC是逃不掉的 :)'); e.preventDefault(); }
  });
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// Run on page load
run();
</script>
</body>
</html>
