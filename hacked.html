<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>系统服务</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#000; min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  color:#fff; overflow:hidden;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* Ambient scan lines */
body::after {
  content:''; position:fixed; top:0;left:0;right:0;bottom:0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 4px);
  pointer-events:none; z-index:1000;
}

/* ============================================================
   SCENE: BOOT
   ============================================================ */
.boot { width:100%; max-width:400px; padding:30px; text-align:center; }
.boot .boot-logo { font-size:56px; margin-bottom:16px; }
.boot .boot-title { font-size:12px; color:rgba(255,255,255,0.4); letter-spacing:4px; margin-bottom:20px; }
.boot .boot-log { text-align:left; font:11px/2 "SF Mono","Courier New",monospace; color:rgba(255,255,255,0.25); max-width:300px; margin:0 auto; transition:color 0.2s; }
.boot .boot-log .done { color:rgba(50,215,75,0.6); }

/* ============================================================
   SCENE: TARGET
   ============================================================ */
.target { width:100%; max-width:400px; padding:30px; text-align:center; }
.target .tgt-radar {
  width:180px; height:180px; border-radius:50%; margin:0 auto 20px;
  border:2px solid rgba(255,255,255,0.08);
  position:relative; overflow:hidden;
  background: radial-gradient(circle at center, rgba(255,59,48,0.08) 0%, transparent 60%);
}
.target .tgt-radar .tgt-sweep {
  position:absolute; top:50%; left:50%; width:50%; height:1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.3), transparent);
  transform-origin:0 0; animation: radarSweep 2s linear infinite;
}
@keyframes radarSweep { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.target .tgt-radar .tgt-dot {
  position:absolute; width:8px; height:8px; background:#ff3b30; border-radius:50%;
  box-shadow:0 0 8px #ff3b30; animation: dotBlink 0.8s ease infinite;
}
@keyframes dotBlink { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
.target .tgt-title { font-size:16px; font-weight:600; color:rgba(255,255,255,0.7); margin-bottom:6px; }
.target .tgt-sub { font-size:13px; color:rgba(255,255,255,0.3); line-height:1.8; }

/* ============================================================
   SCENE: BREACH
   ============================================================ */
.breach { width:100%; max-width:400px; padding:24px; text-align:center; }
.breach .br-badge {
  display:inline-block; padding:6px 18px; border-radius:20px;
  background:rgba(255,200,0,0.1); color:#fc0; font-size:12px; font-weight:700;
  letter-spacing:2px; margin-bottom:16px;
}
.breach .br-list { text-align:left; font:12px/2.2 "SF Mono","Courier New",monospace; max-width:300px; margin:0 auto; }
.breach .br-list .pass-try { color:rgba(255,255,255,0.2); }
.breach .br-list .pass-fail { color:rgba(255,59,48,0.5); }
.breach .br-list .pass-ok { color:rgba(50,215,75,0.7); }
.breach .br-result { margin-top:20px; padding:14px; background:rgba(255,59,48,0.06); border:1px solid rgba(255,59,48,0.15); border-radius:8px; }
.breach .br-result .br-ip { font:10px/1.8 "SF Mono",monospace; color:rgba(255,255,255,0.3); }
.breach .br-result .br-head { font-size:14px; font-weight:700; color:#ff3b30; margin:6px 0; }

/* ============================================================
   SCENE: DATA CARDS
   ============================================================ */
.datacards { width:100%; max-width:400px; padding:16px; }
.datacards .dc-badge {
  display:inline-block; padding:5px 16px; border-radius:20px;
  font-size:12px; font-weight:700; letter-spacing:2px; margin-bottom:14px;
}
.dc-badge.warn { background:rgba(255,59,48,0.12); color:#ff3b30; animation:badgePulse 1.5s ease infinite; }
.dc-badge.info { background:rgba(255,200,0,0.1); color:#fc0; }
@keyframes badgePulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,0.3);} 50%{box-shadow:0 0 0 24px rgba(255,59,48,0);} }

.dc-card {
  background:rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.05);
  border-radius:10px; padding:16px; margin-bottom:8px; text-align:left;
  animation: cardSlide 0.35s ease both;
}
@keyframes cardSlide { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
.dc-card .dc-icon { font-size:22px; margin-bottom:4px; }
.dc-card .dc-title { font-size:12px; font-weight:600; color:rgba(255,255,255,0.5); margin-bottom:4px; }
.dc-card .dc-val { font-size:14px; color:rgba(255,255,255,0.7); line-height:1.7; }

.dc-footer { text-align:center; margin-top:14px; font-size:12px; color:rgba(255,255,255,0.18); line-height:1.8; }

/* ============================================================
   SCENE: COUNTDOWN
   ============================================================ */
.countdown-overlay {
  position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.95);
  z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.countdown-overlay .cd-num {
  font:200 120px "SF Mono","Courier New",monospace;
  color:#ff3b30; transition:transform 0.15s ease, color 0.15s ease;
}
.countdown-overlay .cd-num.boom { transform:scale(1.15); color:#fff; }
.countdown-overlay .cd-label { font-size:13px; color:rgba(255,255,255,0.3); margin-top:8px; letter-spacing:4px; }

/* ============================================================
   SCENE: FINAL
   ============================================================ */
.final { text-align:center; padding:30px 20px; animation: cardSlide 0.5s ease; }
.final .fn-emoji { font-size:64px; margin-bottom:12px; }
.final .fn-title { font-size:19px; font-weight:700; color:#fff; margin-bottom:8px; }
.final .fn-sub { font-size:14px; color:rgba(255,255,255,0.4); line-height:1.8; margin-bottom:18px; }
.final .fn-btn {
  display:inline-block; padding:13px 36px; border-radius:24px; background:#fff; color:#000;
  font-size:15px; font-weight:700; border:none; cursor:pointer; font-family:inherit;
  letter-spacing:1px; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.final .fn-btn:active { transform:scale(0.96); }

/* ============================================================
   EFFECTS
   ============================================================ */
.red-flash { position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(255,0,0,0.12); pointer-events:none; z-index:400; animation:flashOut 0.7s ease-out forwards; }
.white-flash { position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(255,255,255,0.08); pointer-events:none; z-index:400; animation:flashOut 0.5s ease-out forwards; }
@keyframes flashOut { 0%{opacity:1;} 100%{opacity:0;} }

body.shake { animation: bShake 0.1s linear 4; }
@keyframes bShake { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-6px,3px);} 50%{transform:translate(5px,-4px);} 75%{transform:translate(-2px,1px);} }

body.glitch { animation: bGlitch 0.12s linear 3; }
@keyframes bGlitch { 0%,100%{filter:none;transform:none;} 33%{filter:hue-rotate(90deg);transform:skewX(2deg);} 66%{filter:hue-rotate(-60deg);transform:skewX(-1deg);} }

.toast {
  position:fixed; top:0; left:0; right:0; z-index:600; padding:12px 20px;
  text-align:center; font-size:13px; font-weight:600;
  animation: toastIn 0.3s ease-out;
}
.toast.red { background:rgba(255,59,48,0.95); color:#fff; }
.toast.green { background:rgba(50,215,75,0.9); color:#000; }
.toast.white { background:rgba(255,255,255,0.9); color:#000; }
@keyframes toastIn { from{transform:translateY(-100%);} to{transform:translateY(0);} }

/* Matrix rain */
.matrix-rain { position:fixed; top:0;left:0;right:0;bottom:0; pointer-events:none; z-index:300; }
.matrix-char { position:absolute; color:rgba(0,255,0,0.3); font:12px monospace; animation: matrixFall linear forwards; }
@keyframes matrixFall { 0%{transform:translateY(-20px);opacity:1;} 100%{transform:translateY(105vh);opacity:0;} }

/* Crack overlay */
.crack-overlay { position:fixed; top:0;left:0;right:0;bottom:0; pointer-events:none; z-index:450; }
.crack-overlay .crack-line {
  position:absolute; background:rgba(255,255,255,0.6); transform-origin:0 0;
  animation: crackAppear 0.3s ease-out forwards;
}
@keyframes crackAppear { from{transform:scaleX(0);} to{transform:scaleX(1);} }

/* Dialog */
.dialog-overlay {
  position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.8);
  z-index:500; display:flex; align-items:center; justify-content:center;
  animation: fadeIn 0.2s ease;
}
.dialog-box { background:#1c1c1e; border-radius:14px; max-width:290px; width:90%; overflow:hidden; animation: popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes popIn { from{transform:scale(0.85);opacity:0;} to{transform:scale(1);opacity:1;} }
.dialog-box .dlg-header { padding:24px 20px 0; text-align:center; }
.dialog-box .dlg-header .dlg-icon { font-size:44px; margin-bottom:8px; }
.dialog-box .dlg-header .dlg-title { font-size:17px; font-weight:600; }
.dialog-box .dlg-body { padding:8px 20px 18px; text-align:center; font-size:13px; color:rgba(255,255,255,0.5); line-height:1.6; }
.dialog-box .dlg-btns { border-top:1px solid rgba(255,255,255,0.08); display:flex; }
.dialog-box .dlg-btn { flex:1; padding:12px; text-align:center; font-size:17px; font-weight:500; color:#0a84ff; cursor:pointer; border:none; background:none; font-family:inherit; border-right:1px solid rgba(255,255,255,0.08); touch-action:manipulation; }
.dialog-box .dlg-btn:last-child { border-right:none; }
.dialog-box .dlg-btn:active { background:rgba(255,255,255,0.05); }

@media (max-width:380px) {
  .target .tgt-radar { width:150px;height:150px; }
  .dc-card { padding:14px; }
  .dc-card .dc-val { font-size:13px; }
}
</style>
</head>

var root = document.getElementById('app');
var audioCtx = null;

function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(f,d,v) {
  try { var c=ctx(),o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(v||0.03,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d); o.connect(g);g.connect(c.destination); o.start();o.stop(c.currentTime+d); } catch(e) {}
}
function beepHi(){beep(880,0.06,0.03);} function beepLo(){beep(180,0.12,0.04);}
function beepDouble(){beep(440,0.08,0.03);beep(880,0.1,0.03);}
function beepAlert(){beep(330,0.12,0.04);setTimeout(function(){beep(660,0.1,0.04);},120);setTimeout(function(){beep(990,0.08,0.03);},240);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function rng(mn,mx){return Math.floor(Math.random()*(mx-mn+1))+mn;}

// Effects
function flash(color){var f=document.createElement('div');f.className=color==='white'?'white-flash':'red-flash';document.body.appendChild(f);setTimeout(function(){f.remove();},800);}
function shake(){document.body.classList.add('shake');setTimeout(function(){document.body.classList.remove('shake');},500);}
function glitch(){document.body.classList.add('glitch');setTimeout(function(){document.body.classList.remove('glitch');},600);}
function vibrate(p){if(navigator.vibrate)navigator.vibrate(p);}

function toast(msg,color){
  var t=document.createElement('div');t.className='toast '+(color||'red');t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.transform='translateY(-100%)';t.style.transition='transform 0.3s';setTimeout(function(){t.remove();},300);},1800);
}

function matrixRain(dur){
  var container=document.createElement('div');container.className='matrix-rain';
  var chars='01アイウエオカキクケコサシスセソタチツテト';
  var w=window.innerWidth;
  for(var i=0;i<40;i++){
    var s=document.createElement('span');s.className='matrix-char';
    s.textContent=chars[Math.floor(Math.random()*chars.length)];
    s.style.left=Math.random()*w+'px';
    s.style.animationDuration=(1.5+Math.random()*3)+'s';
    s.style.animationDelay=Math.random()*0.8+'s';
    container.appendChild(s);
  }
  document.body.appendChild(container);
  setTimeout(function(){container.remove();},dur||3000);
}

function crackScreen(){
  var c=document.createElement('div');c.className='crack-overlay';
  for(var i=0;i<6;i++){
    var line=document.createElement('div');line.className='crack-line';
    var x=Math.random()*window.innerWidth,y=Math.random()*window.innerHeight;
    line.style.left=x+'px';line.style.top=y+'px';
    line.style.width=(40+Math.random()*120)+'px';line.style.height=(1+Math.random()*2)+'px';
    line.style.transform='rotate('+((Math.random()-0.5)*90)+'deg)';
    line.style.animationDelay=Math.random()*0.2+'s';
    c.appendChild(line);
  }
  document.body.appendChild(c);
  setTimeout(function(){c.remove();},600);
}

function showDialog(icon,title,body,cancelText,okText){
  return new Promise(function(resolve){
    var overlay=document.createElement('div');overlay.className='dialog-overlay';
    overlay.innerHTML='<div class="dialog-box"><div class="dlg-header"><div class="dlg-icon">'+icon+'</div><div class="dlg-title">'+title+'</div></div><div class="dlg-body">'+body+'</div><div class="dlg-btns"><button class="dlg-btn" id="dc">'+cancelText+'</button><button class="dlg-btn" id="do" style="font-weight:600;">'+okText+'</button></div></div>';
    document.body.appendChild(overlay);
    document.getElementById('dc').onclick=function(){overlay.remove();resolve(false);};
    document.getElementById('do').onclick=function(){overlay.remove();resolve(true);};
  });
}

// SCENE 0: BOOT
// ============================================================
async function sceneBoot(){
  root.innerHTML='<div class="boot"><div class="boot-logo">🔐</div><div class="boot-title">SECURE TERMINAL</div><div class="boot-log" id="blog"></div></div>';
  var log=document.getElementById('blog');
  var lines=[
    'Initializing secure channel...',
    'Handshake with node-'+Math.random().toString(36).substring(2,8)+'...',
    'TLS 1.3 established.',
    'Loading exploit kit...',
    'Target identified: '+navigator.platform||'Unknown',
    'Screen: '+window.screen.width+'x'+window.screen.height,
    'Battery: '+rng(8,92)+'%',
    'User agent fingerprint captured.',
    '',
    'ACCESS GRANTED.',
  ];
  for(var i=0;i<lines.length;i++){
    log.innerHTML+=lines[i]+'<br>';
    if(i===lines.length-3) matrixRain(2000);
    if(i===lines.length-1){ log.innerHTML+='<span class="done">SYSTEM COMPROMISED.</span><br>'; beepAlert(); flash('red'); }
    else beepLo();
    await sleep(rng(120,300));
  }
  await sleep(600);
}

// ============================================================
// SCENE 1: TARGET ACQUISITION
// ============================================================
async function sceneTarget(){
  var dotTop=rng(20,70), dotLeft=rng(25,65);
  root.innerHTML='<div class="target">'
    +'<div class="tgt-radar"><div class="tgt-sweep"></div><div class="tgt-dot" style="top:'+dotTop+'%;left:'+dotLeft+'%;" id="tdot"></div></div>'
    +'<div class="tgt-title">正在定位目标设备...</div>'
    +'<div class="tgt-sub" id="tsub">扫描附近信号源...</div></div>';

  // Animate the dot blinking
  for(var i=0;i<4;i++){
    document.getElementById('tdot').style.opacity=i%2?'1':'0.3';
    beepHi();
    await sleep(500);
  }

  document.getElementById('tdot').style.background='#32d74b';
  document.getElementById('tdot').style.boxShadow='0 0 12px #32d74b';
  document.getElementById('tdot').style.opacity='1';
  document.getElementById('tgt-title').textContent='目标已锁定';
  document.getElementById('tsub').textContent='IP: 192.168.'+rng(1,254)+'.'+rng(1,254)+'\n设备型号：Potato Phone Pro Max Ultra';
  beepAlert(); flash('red'); vibrate([20,30,20]);
  toast('📍 设备位置已确认','red');

// ============================================================
// SCENE 4: DATA EXTRACTION
// ============================================================
async function sceneData(){
  root.innerHTML='<div class="datacards"><div class="dc-badge info">🔓 解密隐私数据...</div></div>';
  var container=root.querySelector('.datacards');

  var used=[];
  var pool=SECRETS_POOL.slice();

    {icon:'📷',title:'相册元数据分析'},
    {icon:'🌐',title:'浏览器历史记录'},
    {icon:'💬',title:'社交行为模式'},
    {icon:'🎵',title:'深夜听歌报告'},
    {icon:'🛒',title:'消费行为画像'},
  ];

  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    var idx=Math.floor(Math.random()*pool.length);

  footer.style.animationDelay='1s';
  footer.innerHTML='数据来源：你的手机<br>真实性：千真万确（大概）';
  container.appendChild(footer);

  await sleep(400);
  glitch();flash('white');vibrate([10,15,10,15,10,15,10]);

// ============================================================
// SCENE 5: COUNTDOWN + CRACK
// ============================================================
async function sceneCountdown(){
  var overlay=document.createElement('div');overlay.className='countdown-overlay';
  overlay.innerHTML='<div class="cd-num" id="cdn">5</div><div class="cd-label">⚠ 数据即将上传至公共网络 ⚠</div>';
  document.body.appendChild(overlay);

  for(var i=5;i>=1;i--){
    document.getElementById('cdn').textContent=i;
    document.getElementById('cdn').classList.add('boom');
    beep(220+(5-i)*150,0.2,0.06);
    vibrate([10,10,10]);
    await sleep(300);
    document.getElementById('cdn').classList.remove('boom');
    await sleep(700);
  }

  // Fake crash
  crackScreen();shake();glitch();flash('white');
  overlay.innerHTML='<div class="cd-num" style="color:#fff;font-size:48px;">😏</div><div class="cd-label">骗你的</div>';
  toast('上传已取消','white');
  await sleep(2000);
  overlay.remove();
}

// ============================================================
// RUN
// ============================================================
async function run(){
  root.style.display='';
  document.addEventListener('click',function a(){ctx();document.removeEventListener('click',a);},{once:true});

  await sceneBoot();
  await sceneTarget();
  await sceneBreach();
  await sceneFiles();
  await sceneData();
  await sceneCountdown();
  sceneFinal();
}

// ============================================================
// AMBIENT INTERACTIONS
// ============================================================
document.addEventListener('click',function(e){
  if(e.target.tagName==='BUTTON')return;
  if(Math.random()>0.4){flash('red');beep(rng(300,700),0.04,0.015);}
});

document.addEventListener('contextmenu',function(e){e.preventDefault();toast('🔒 右键已被封印','red');});

document.addEventListener('visibilitychange',function(){
  if(document.hidden&&Math.random()>0.4)toast('数据传输未完成，请勿离开','red');
});

// Escape key
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){e.preventDefault();toast('按 ESC 也无法逃脱','white');}
});

// Shake detection
var lastShake=0;
if(typeof DeviceMotionEvent!=='undefined'){
  window.addEventListener('devicemotion',function(e){
    var a=e.accelerationIncludingGravity;if(!a)return;
    var m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
    if(m>20){var n=Date.now();if(n-lastShake<800)return;lastShake=n;shake();flash('red');toast('📳 摇晃无法中断入侵','red');}
  });
}

run();
</script>
