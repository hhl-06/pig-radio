<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>系统服务</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background:#000;
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  color:#fff; overflow:hidden;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ============================================================
   SCENE 1: FAKE LOCK SCREEN
   ============================================================ */
.lockscreen {
  width:100%; max-width:400px; text-align:center; padding:40px 24px;
}
.lockscreen .ls-time {
  font-size:64px; font-weight:200; letter-spacing:4px; margin-bottom:4px;
}
.lockscreen .ls-date {
  font-size:15px; color:rgba(255,255,255,0.5); margin-bottom:40px;
}
.lockscreen .ls-icon {
  font-size:72px; margin-bottom:16px; animation: floatIcon 2s ease-in-out infinite;
}
@keyframes floatIcon { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
.lockscreen .ls-title {
  font-size:17px; font-weight:600; color:rgba(255,255,255,0.7); margin-bottom:8px;
}
.lockscreen .ls-subtitle {
  font-size:13px; color:rgba(255,255,255,0.35); line-height:1.8;
}
.lockscreen .ls-bar-wrap {
  width:200px; height:4px; background:rgba(255,255,255,0.1); border-radius:2px;
  margin:24px auto; overflow:hidden;
}
.lockscreen .ls-bar {
  height:100%; background:rgba(255,255,255,0.5); border-radius:2px;
  transition:width 0.3s ease; width:0%;
}

/* ============================================================
   SCENE 2: DATA PANELS
   ============================================================ */
.data-panel {
  width:100%; max-width:400px; padding:20px; text-align:center;
  animation: panelIn 0.5s ease;
}
@keyframes panelIn { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

.data-panel .dp-badge {
  display:inline-block; padding:6px 18px; border-radius:20px;
  background:rgba(255,59,48,0.15); color:#ff3b30; font-size:12px; font-weight:700;
  letter-spacing:2px; margin-bottom:20px;
  animation: pulseBadge 1.5s ease infinite;
}
@keyframes pulseBadge {
  0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,0.4);}
  50%{box-shadow:0 0 0 16px rgba(255,59,48,0);}
}

.data-panel .dp-card {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:20px; margin-bottom:12px;
  text-align:left; transition:all 0.3s;
}
.data-panel .dp-card .dp-card-icon { font-size:28px; margin-bottom:8px; }
.data-panel .dp-card .dp-card-title { font-size:13px; font-weight:700; color:rgba(255,255,255,0.8); margin-bottom:4px; }
.data-panel .dp-card .dp-card-val { font-size:15px; color:rgba(255,255,255,0.5); line-height:1.6; }

.data-panel .dp-footer {
  margin-top:20px; font-size:12px; color:rgba(255,255,255,0.25);
  line-height:1.8;
}

/* ============================================================
   SCENE 3: FINAL TWIST
   ============================================================ */
.twist {
  text-align:center; padding:30px 20px;
  animation: panelIn 0.5s ease;
}
.twist .twist-emoji { font-size:80px; margin-bottom:16px; }
.twist .twist-title { font-size:20px; font-weight:700; color:#fff; margin-bottom:8px; }
.twist .twist-sub { font-size:14px; color:rgba(255,255,255,0.5); line-height:1.8; margin-bottom:20px; }

/* ============================================================
   RED ALERT FLASH
   ============================================================ */
.red-flash {
  position:fixed; top:0;left:0;right:0;bottom:0;
  background:rgba(255,0,0,0.15); pointer-events:none; z-index:100;
  animation: redPulse 0.8s ease-out forwards;
}
@keyframes redPulse {
  0%{opacity:1;}
  100%{opacity:0;}
}

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position:fixed; top:0; left:0; right:0; z-index:200;
  background:rgba(255,59,48,0.95); color:#fff; text-align:center;
  padding:12px 20px; font-size:13px; font-weight:600;
  animation: toastDown 0.3s ease-out;
}
@keyframes toastDown { from{transform:translateY(-100%);} to{transform:translateY(0);} }

/* ============================================================
   SHAKE
   ============================================================ */
body.shaking { animation: bodyShake 0.12s linear 3; }
@keyframes bodyShake {
  0%,100%{transform:translate(0,0);}
  25%{transform:translate(-8px,3px);}
  50%{transform:translate(5px,-5px);}
  75%{transform:translate(-3px,1px);}
}

/* ============================================================
   BUTTON
   ============================================================ */
.btn-white {
  display:inline-block; padding:14px 40px; border-radius:25px;
  background:#fff; color:#000; font-size:16px; font-weight:700;
  border:none; cursor:pointer; font-family:inherit;
  transition:all 0.15s; letter-spacing:1px;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.btn-white:hover { transform:scale(1.03); }
.btn-white:active { transform:scale(0.97); }
</style>
</head>
<body>

<div id="app"></div>

<script>
var root = document.getElementById('app');

function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

var SECRETS = [
  '浏览器记录：87% 是"拖延症怎么治"',
  '本周打开外卖App 41次，下单0次',
  '手机日均亮屏 11.7 小时，击败全国 98% 的人',
  '过去一年共撤回消息 341 条，其中 340 条是打错字',
  '自拍数量：2,847 张。角度完全相同的占 94%',
  '闹钟平均响 4.7 次才起床，比预期晚 48 分钟',
  '周末平均起床时间：11:47',
  '深夜0-3点活跃度极高，第二天状态极差',
  '说"好的"的频率异常高（其实并不好）',
  '微信占手机内存 58%，远超其他App',
  '购物车待付款：47件。超半年未付：36件',
  '密码含"123"概率极高，安全评级 F',
  '运动App步数：本周 7 步（不含上厕所）',
  'B站弹幕中"哈哈哈"占 67%（其实并不好笑）'
];

var LIES = [
  'DNA 回溯：你的基因中有 0.003% 土豆血统 🥔',
  '前世追溯：唐朝御膳房一只偷吃的猫',
  'WiFi 记录：蹭过 17 个陌生人的网络',
  '输入法已经可以完美模拟你的聊天风格',
  '淘宝标签：只逛不买，高风险用户',
  '深夜歌曲排行：《大悲咒》x 347 遍（为了助眠）'
];

var FAKE_FILES = [
  '简历_最终版_v3_final_真的不改了.doc',
  '计划表（从来没执行过）.xlsx',
  '表情包收藏（重要文件）.zip',
  '待处理（永远不会处理）.txt'
];

function flashRed() {
  var f = document.createElement('div'); f.className = 'red-flash';
  document.body.appendChild(f); setTimeout(function(){ f.remove(); }, 900);
}
function showToast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.transform='translateY(-100%)';t.style.transition='transform 0.3s';setTimeout(function(){t.remove();},300); }, 2000);
}
function shakeBody() {
  document.body.classList.add('shaking');
  setTimeout(function(){ document.body.classList.remove('shaking'); }, 500);
}

// ============================================================
// SCENE 1: Lock Screen
// ============================================================
function renderScene1() {
  var now = new Date();
  var hh = now.getHours().toString().padStart(2,'0');
  var mm = now.getMinutes().toString().padStart(2,'0');
  var weekdays = ['日','一','二','三','四','五','六'];
  var dateStr = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+weekdays[now.getDay()];

  root.innerHTML = '<div class="lockscreen">'
    + '<div class="ls-time">'+hh+':'+mm+'</div>'
    + '<div class="ls-date">'+dateStr+'</div>'
    + '<div class="ls-icon">📡</div>'
    + '<div class="ls-title">正在建立安全连接...</div>'
    + '<div class="ls-subtitle">检测到未知节点请求接入<br>正在验证身份...</div>'
    + '<div class="ls-bar-wrap"><div class="ls-bar" id="lsBar"></div></div>'
    + '</div>';

  var bar = document.getElementById('lsBar');
  var pct = 0, t = setInterval(function(){
    pct += Math.random() * 12; if (pct > 100) pct = 100;
    bar.style.width = pct + '%';
    if (pct >= 100) clearInterval(t);
  }, 100);
  return sleep(1200);
}

// ============================================================
// SCENE 2: Data Extraction
// ============================================================
function renderScene2() {
  var files = FAKE_FILES.slice();
  var html = '<div class="data-panel">'
    + '<div class="dp-badge">⚠ 检测到漏洞</div>';

  // File scan card
  html += '<div class="dp-card" style="animation:panelIn 0.4s ease;">'
    + '<div class="dp-card-icon">📂</div>'
    + '<div class="dp-card-title">正在扫描文件系统...</div>'
    + '<div class="dp-card-val">';
  files.forEach(function(f){
    html += 'C:\\\\Users\\\\you\\\\' + f + '<br>';
  });
  html += '</div></div>';

  // Data cards
  var dataTypes = [
    { icon:'📷', title:'解密相册元数据', val:'检测到 '+pick(['大量','海量','天文数字般的'])+' 自拍。角度相似度：94%' },
    { icon:'🌐', title:'提取浏览器历史', val:pick(SECRETS.slice(0,6)) },
    { icon:'💬', title:'分析社交行为', val:pick(SECRETS.slice(6,12)) },
  ];

  dataTypes.forEach(function(d, i){
    html += '<div class="dp-card" style="animation:panelIn 0.4s '+(0.2*i)+'s ease both;">'
      + '<div class="dp-card-icon">'+d.icon+'</div>'
      + '<div class="dp-card-title">'+d.title+'</div>'
      + '<div class="dp-card-val">'+d.val+'</div>'
      + '</div>';
  });

  html += '</div>';
  root.innerHTML = html;
  flashRed();
  return sleep(800);
}

// ============================================================
// SCENE 3: The Reveal
// ============================================================
function renderScene3() {
  var s1 = pick(SECRETS), s2 = pick(SECRETS), s3 = pick(SECRETS);
  while (s2 === s1) s2 = pick(SECRETS);
  while (s3 === s1 || s3 === s2) s3 = pick(SECRETS);

  root.innerHTML = '<div class="data-panel">'
    + '<div class="dp-badge" style="background:rgba(255,255,255,0.1);color:#fff;">📋 机密档案解密完成</div>'
    + '<div class="dp-card" style="animation:panelIn 0.3s ease both;">'
    + '<div class="dp-card-icon">🔍</div><div class="dp-card-title">发现 1</div><div class="dp-card-val">'+s1+'</div></div>'
    + '<div class="dp-card" style="animation:panelIn 0.3s 0.15s ease both;">'
    + '<div class="dp-card-icon">🔍</div><div class="dp-card-title">发现 2</div><div class="dp-card-val">'+s2+'</div></div>'
    + '<div class="dp-card" style="animation:panelIn 0.3s 0.3s ease both;">'
    + '<div class="dp-card-icon">🔍</div><div class="dp-card-title">发现 3</div><div class="dp-card-val">'+s3+'</div></div>'
    + '<div class="dp-footer" style="animation:panelIn 0.3s 0.5s ease both;">'
    + '🤖 AI 综合评估：<br>'+pick(LIES)+'</div>'
    + '</div>';

  flashRed(); shakeBody();
  showToast('⚠ 数据提取完成');

  return sleep(1200);
}

// ============================================================
// SCENE 4: The Twist
// ============================================================
function renderFinal() {
  root.innerHTML = '<div class="twist">'
    + '<div class="twist-emoji">😏</div>'
    + '<div class="twist-title">以上数据均为随机生成</div>'
    + '<div class="twist-sub">你的真实数据比这个还离谱<br>但我们就不曝光了</div>'
    + '<button class="btn-white" onclick="doRun()">🔄 再来一次</button>'
    + '</div>';
}

// ============================================================
// RUN
// ============================================================
async function doRun() {
  root.style.display = '';
  await renderScene1();
  await renderScene2();
  await sleep(600);
  await renderScene3();
  await sleep(1500);
  renderFinal();
}

// Touch anywhere for extra effects
document.addEventListener('click', function(e){
  if (e.target.tagName === 'BUTTON') return;
  if (Math.random() > 0.6) flashRed();
});

// Exit trap
document.addEventListener('visibilitychange', function(){
  if (document.hidden && Math.random() > 0.5) showToast('数据正在上传中，别走！');
});

doRun();
</script>
</body>
</html>
